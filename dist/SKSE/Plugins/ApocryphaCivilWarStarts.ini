; Alternate Perspective - Civil War Starts
;
; An add-on for Alternate Perspective. The Messenger in the Resting Pilgrim offers a "Civil War"
; card with two starts under it:
;
;   Stormcloak Recruit - the war room of the Palace of the Kings, Windhelm
;   Imperial Recruit   - the war room of Castle Dour, Solitude
;
; Either way you begin in that side's uniform, with the game's own civil war recruitment quest
; running and an officer waiting to put you to the test.
;
; Every setting here applies to both sides. They are also controls on this mod's page in the
; Apocrypha Menu Framework, and the page's Save button writes back to this file, keeping your
; comments as they are.

[General]
; 1 runs the start, 0 leaves both options in Alternate Perspective's menu but makes choosing one do
; nothing - a way to switch them off without uninstalling mid-playthrough.
bEnabled=1

; Seconds to wait after Alternate Perspective starts this mod's quest before acting.
;
; AP is still finishing its own hand-off at that moment: it fades the screen, freezes the player,
; and then watches to see whether the chosen start moves them out of the start cell. Waiting a
; moment lets the fade cover the arrival. Waiting too long trips AP's own safety net, which says
; "You seem to be stuck. I'll move you into the Helgen Inn." and puts you in Helgen instead.
; One second sits comfortably between the two. Raise it a little if you ever arrive back in the
; Resting Pilgrim; lower it if you ever land in Helgen.
fStartDelaySeconds=1.00

; The beat between the parts of the start: the move, then filling the pack, then each piece of the
; uniform going on, then the questline.
;
; They are deliberately NOT done in one frame. A cross-cell teleport and a full set of armour
; appearing are both heavy pieces of 3D work, and together in a single frame they make every mod
; that rebuilds itself from the player's body do so at once. On the first end-to-end run the game
; crashed three seconds after arrival inside Faster HDT-SMP, rebuilding collision bodies on its own
; worker thread - not this mod's code, but this mod's churn is what it was handed.
;
; Raise it to make the start gentler and slower. 0 puts everything back into one frame.
fStageGapSeconds=0.40

[Start]
; Move the player to their side's war room - the floor beside the war map, where that side's
; command stands.
bMoveToWarRoom=1

; Hand over the uniform - heavy armour, an axe or a sword, and a shield.
;
; Stormcloak: with Sons of Skyrim installed you get Windhelm's own kit - Windhelm Heavy Armor, the
; Windhelm helmet and shield, heavy lamellar boots and gauntlets, and a Nord war axe. Without it,
; the game's own Stormcloak uniform with an iron shield and an iron war axe.
;
; Imperial: the Legion's heavy set - Imperial armour, boots, gauntlets, helmet, shield and sword.
;
; Sons of Skyrim is NOT a requirement. The mod checks whether its plugin is loaded and uses the
; game's own gear when it is not; the log says which of the two it chose.
bGiveStarterEquipment=1

; Wear it straight away rather than leaving it in the pack.
bEquipStarterEquipment=1

; Start the game's own recruitment quest at its own opening stage - CW01B "Joining the Stormcloaks"
; or CW01A "Joining the Legion". Nothing is skipped ahead: the oath, the officer's test and
; everything after it happen in game exactly as they always do. 0 leaves you kitted out in the war
; room with no quest running.
bStartCivilWarQuest=1

[Debug]
; How much detail reaches
; Documents\My Games\Skyrim Special Edition\SKSE\ApocryphaCivilWarStarts.log
;   0 trace (shipped default - every decision this mod makes)
;   1 debug   2 info   3 warning   4 error   5 critical   6 off
; It ships at 0 so a bug report arrives with the log already complete.
uLogLevel=0
